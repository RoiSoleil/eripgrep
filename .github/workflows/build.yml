name: build
on:
   push:
      branches:
      - main
   pull_request:
permissions:
   contents: write
jobs:
   build:
      runs-on: ubuntu-latest
      steps:
      -  name: Checkout
         uses: actions/checkout@v5
      -  name: Set up JDK
         uses: actions/setup-java@v5
         with:
            distribution: temurin
            java-version: 21
      -  name: Setup Maven
         uses: stCarolas/setup-maven@v5
         with:
           maven-version: 3.9.11
      -  name: Set up cache
         uses: actions/cache@v4.2.4
         with:
           path: ~/.m2/repository
           key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
           restore-keys: |
             ${{ runner.os }}-maven-
      -  name: Install RipGrep
         run: sudo apt-get update && sudo apt-get install -y ripgrep
      -  name: Build
         # The tests of the view run in a workbench: they need a display.
         run: xvfb-run -a mvn -B clean install
      -  name: Upload the test reports
         if: failure()
         uses: actions/upload-artifact@v7
         with:
            name: surefire-reports
            path: tests/org.eclipse.eripgrep.tests/target/surefire-reports
      -  name: Release
         if: github.event_name == 'push'
         env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest --prerelease --title "Development Build" --target "$GITHUB_SHA" \
               --notes "Latest build of the main branch." \
               update-site/org.eclipse.eripgrep/target/org.eclipse.eripgrep.updatesite-*-SNAPSHOT.zip
      -  name: Publish p2 update site
         if: github.event_name == 'push'
         env:
            ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
         run: |-
            git clone --branch update-site https://github.com/RoiSoleil/eripgrep
            cd eripgrep
            cd latest
            git config user.name "RoiSoleil"
            git config user.email "helios.gilles@gmail.com"
            rm -fr *
            cp -r ../../update-site/org.eclipse.eripgrep/target/repository/* .
            git add .
            git commit -m "New version of the update site"
            git push -f https://RoiSoleil:$ACTIONS_TOKEN@github.com/RoiSoleil/eripgrep update-site
         shell: bash
